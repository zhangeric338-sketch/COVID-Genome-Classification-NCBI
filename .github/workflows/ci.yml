name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.png', 'data/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '**.png', 'data/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job on the oldest supported Python: each extra job is billed as at least a minute.
  check:
    name: Lint & Import Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check --output-format=github .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Verify Python syntax
        run: python -m compileall -q main.py src tools

      - name: Verify imports work
        run: |
          python -c "from src.visualization import visualize_dataset, split_dataset, get_strain_from_accession"
          python -c "from tools.download_data import download_dataset_balanced, check_cli_available"
          python -c "import src.training"
          python -c "import main"
